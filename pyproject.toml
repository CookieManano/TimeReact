[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timereact"
version = "0.2.0"
description = "Reliable time context and persistent timers for AI agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
timereact = "timereact.cli:main"
timereact-mcp = "timereact.server:main"

[tool.setuptools.packages.find]
where = ["src"]
